[project]
name = "icloud-mcp"
version = "0.1.0"
description = "iCloud Mail und Apple Kalender als MCP-Server für Claude"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.13",
  "imapclient>=3.0",
  "caldav>=1.4",
  "icalendar>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
